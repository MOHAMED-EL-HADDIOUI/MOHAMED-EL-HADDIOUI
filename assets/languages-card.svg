<svg xmlns="http://www.w3.org/2000/svg" width="360" height="175" viewBox="0 0 360 175" role="img" aria-label="Most Used Languages">
<style>
  .t{font:600 18px 'Segoe UI',Ubuntu,Sans-Serif;fill:#7AA2F7}
  .l{font:400 14px 'Segoe UI',Ubuntu,Sans-Serif;fill:#a9b1d6}
  .v{font:700 14px 'Segoe UI',Ubuntu,Sans-Serif;fill:#bb9af7}
  .big{font:700 28px 'Segoe UI',Ubuntu,Sans-Serif;fill:#bb9af7}
  .s{font:400 12px 'Segoe UI',Ubuntu,Sans-Serif;fill:#565f89}
  .fade{opacity:0;animation:f .6s ease-out forwards}
  @keyframes f{to{opacity:1}}
  @keyframes g{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  .bar{transform-box:fill-box;transform-origin:left;animation:g .9s ease-out forwards}
</style>
<rect x=".5" y=".5" rx="12" width="359" height="174" fill="#1a1b27" stroke="#7AA2F7" stroke-opacity=".35"/>
<text x="24" y="34" class="t">Most Used Languages</text>
<rect class="bar" x="24.0" y="52" width="276.3" height="10" fill="#dea584" style="animation-delay:0ms"/><rect class="bar" x="300.3" y="52" width="14.3" height="10" fill="#3178c6" style="animation-delay:150ms"/><rect class="bar" x="314.7" y="52" width="9.0" height="10" fill="#f1e05a" style="animation-delay:300ms"/><rect class="bar" x="323.6" y="52" width="4.9" height="10" fill="#3572A5" style="animation-delay:450ms"/><rect class="bar" x="328.5" y="52" width="4.0" height="10" fill="#e34c26" style="animation-delay:600ms"/><rect class="bar" x="332.5" y="52" width="3.5" height="10" fill="#b07219" style="animation-delay:750ms"/><g class="fade" style="animation-delay:300ms"><circle cx="29" cy="87" r="5" fill="#dea584"/><text x="42" y="92" class="l">Rust <tspan class="s">88.6%</tspan></text></g><g class="fade" style="animation-delay:400ms"><circle cx="189" cy="87" r="5" fill="#3178c6"/><text x="202" y="92" class="l">TypeScript <tspan class="s">4.6%</tspan></text></g><g class="fade" style="animation-delay:500ms"><circle cx="29" cy="113" r="5" fill="#f1e05a"/><text x="42" y="118" class="l">JavaScript <tspan class="s">2.9%</tspan></text></g><g class="fade" style="animation-delay:600ms"><circle cx="189" cy="113" r="5" fill="#3572A5"/><text x="202" y="118" class="l">Python <tspan class="s">1.6%</tspan></text></g><g class="fade" style="animation-delay:700ms"><circle cx="29" cy="139" r="5" fill="#e34c26"/><text x="42" y="144" class="l">HTML <tspan class="s">1.3%</tspan></text></g><g class="fade" style="animation-delay:800ms"><circle cx="189" cy="139" r="5" fill="#b07219"/><text x="202" y="144" class="l">Java <tspan class="s">1.1%</tspan></text></g>
